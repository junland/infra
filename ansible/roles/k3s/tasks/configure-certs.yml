---
#
# Configures the k3s installation to use custom certificates for the domain
#

# Common conditions for server-side HAProxy/TLS handling
- name: Define common conditions
  ansible.builtin.set_fact:
    _k3s_tls_enabled: >-
      {{
        k3s_install_exec == "server" and
        not k3s_haproxy_disable | bool and
        k3s_domain is defined and
        k3s_domain | length > 0
      }}

# Check if domain certificate file exists
- name: Check if domain certificate file exists
  ansible.builtin.stat:
    path: "/etc/pki/ca-trust/source/anchors/{{ k3s_domain }}.pem"
  register: k3s_domain_cert_file
  when: _k3s_tls_enabled

# Check if domain key file exists
- name: Check if domain key file exists
  ansible.builtin.stat:
    path: "/etc/pki/tls/private/{{ k3s_domain }}.key"
  register: k3s_domain_key_file
  when: _k3s_tls_enabled

# Fail early if TLS files are missing
- name: Fail if certificate or key file is missing
  ansible.builtin.fail:
    msg: >-
      TLS certificate or key file is missing for domain {{ k3s_domain }}.
      Expected:
      - /etc/pki/ca-trust/source/anchors/{{ k3s_domain }}.pem
      - /etc/pki/tls/private/{{ k3s_domain }}.key
  when:
    - _k3s_tls_enabled
    - not k3s_domain_cert_file.stat.exists or not k3s_domain_key_file.stat.exists

# Check if TLS secret already exists
- name: Check if TLS secret exists
  ansible.builtin.command:
    cmd: >
      kubectl get secret {{ k3s_domain_tls_secret_name }}
      -n haproxy-ingress
      -o name
  register: k3s_cert_key_secret
  changed_when: false
  failed_when: false
  when: _k3s_tls_enabled

# Create TLS secret if missing
- name: Create TLS secret
  ansible.builtin.command:
    cmd: >
      kubectl create secret tls {{ k3s_domain_tls_secret_name }}
      --cert=/etc/pki/ca-trust/source/anchors/{{ k3s_domain }}.pem
      --key=/etc/pki/tls/private/{{ k3s_domain }}.key
      -n haproxy-ingress
  changed_when: false
  when:
    - _k3s_tls_enabled
    - k3s_cert_key_secret.rc != 0

# Render HAProxy config from template
- name: Render HAProxy config
  ansible.builtin.template:
    src: haproxy-config.j2
    dest: /tmp/haproxy-config.yaml
    mode: "0644"
  when: _k3s_tls_enabled

# Apply HAProxy config
- name: Apply HAProxy config
  ansible.builtin.command:
    cmd: kubectl apply -f /tmp/haproxy-config.yaml
  changed_when: false
  when: _k3s_tls_enabled
