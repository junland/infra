---
#
# Configures the k3s installation and sets up kubectl and helm
#

# Download helm installation script
- name: Download helm installation script
  ansible.builtin.get_url:
      url: https://raw.githubusercontent.com/helm/helm/master/scripts/get-helm-3
      dest: /tmp/get_helm.sh
      mode: "0755"
  when: k3s_install_exec == "server"

# Create kubectl configuration directory
- name: Create kubctl configuration directory
  ansible.builtin.file:
      path: /root/.kube
      state: directory
      mode: "0755"
  when: k3s_install_exec == "server"

# Copy kubectl configuration
- name: Copy kubectl configuration
  ansible.builtin.copy:
      src: /etc/rancher/k3s/k3s.yaml
      dest: /root/.kube/config
      mode: "0644"
      remote_src: true
  when: k3s_install_exec == "server"

# Generate kubectl bash completion script
- name: Generate kubectl bash completion script
  ansible.builtin.shell: kubectl completion bash > /etc/bash_completion.d/kubectl
  args:
      creates: /etc/bash_completion.d/kubectl
  when: k3s_install_exec == "server"

# Install helm using the downloaded script
- name: Install helm
  ansible.builtin.command: /tmp/get_helm.sh
  args:
      creates: /usr/local/bin/helm
  when: k3s_install_exec == "server"

# Generate helm bash completion script
- name: Generate helm bash completion script
  ansible.builtin.shell: helm completion bash > /etc/bash_completion.d/helm
  args:
      creates: /etc/bash_completion.d/helm
  when: k3s_install_exec == "server"

# Label agent nodes with the agent role if k3s_install_exec is "agent"
- name: Label agent nodes
  ansible.builtin.command: kubectl label node {{ item }} node-role.kubernetes.io/agent=true --overwrite
  changed_when: false
  loop: "{{ groups['internal_servers'] | difference([inventory_hostname]) }}"
  when: k3s_install_exec == "server"

# Add helm repositories using the helm command line from a list of repos.
- name: Add helm repositories
  ansible.builtin.command: helm repo add {{ item.name }} {{ item.url }}
  changed_when: false
  loop:
      - name: "metallb"
        url: "https://metallb.github.io/metallb"
  when: k3s_install_exec == "server"

# Check that metallb is not already installed
- name: Check if metallb is already installed
  ansible.builtin.command: helm status -n metallb-system metallb
  register: k3s_metallb_check
  failed_when: false
  changed_when: false
  when:
      - k3s_install_exec == "server"
      - k3s_metallb_ip_pool is defined and k3s_metallb_ip_pool != ""

# Put metallb kube config with jinja2 template of metallb.j2
- name: Put metallb kube config with jinja2 template
  ansible.builtin.template:
      src: metallb-config.j2
      dest: /tmp/metallb-config.yaml
      mode: "0644"
  when:
      - k3s_install_exec == "server"
      - k3s_metallb_ip_pool is defined and k3s_metallb_ip_pool != ""
      - k3s_metallb_check.failed or k3s_metallb_check.stdout == ""

# Install metallb using helm if it is not already installed
- name: Install metallb using helm
  ansible.builtin.command: >-
    helm install --create-namespace --wait --hide-notes -n metallb-system
    metallb metallb/metallb
  changed_when: false
  when:
      - k3s_install_exec == "server"
      - k3s_metallb_ip_pool is defined and k3s_metallb_ip_pool != ""
      - k3s_metallb_check.failed or k3s_metallb_check.stdout == ""

# Apply metallb IP pool configuration
- name: Apply metallb IP pool configuration
  ansible.builtin.command: kubectl apply -f /tmp/metallb-config.yaml
  changed_when: false
  when:
      - k3s_install_exec == "server"
      - k3s_metallb_ip_pool is defined and k3s_metallb_ip_pool != ""
      - k3s_metallb_check.failed or k3s_metallb_check.stdout == ""

# Check if ingress-system namespace exists
- name: Check if ingress-system namespace exists
  ansible.builtin.command: kubectl get namespace ingress-system -o name
  register: k3s_ingress_system_namespace
  changed_when: false
  failed_when: false
  when: k3s_install_exec == "server"

# Create ingress-system namespace
- name: Create ingress-system namespace
  ansible.builtin.command: kubectl create namespace ingress-system
  changed_when: false
  failed_when: false
  when:
      - k3s_install_exec == "server"
      - k3s_ingress_system_namespace is defined and k3s_ingress_system_namespace.rc != 0

# Check if domain certificate file is present on the file system
- name: Check if domain certificate file is present on the file system
  ansible.builtin.stat:
      path: "/etc/pki/ca-trust/source/anchors/{{ k3s_domain }}.pem"
  register: k3s_domain_cert_file
  when:
      - k3s_domain is defined
      - k3s_domain != ""
      - k3s_install_exec == "server"

# Check if domain key is present on the file system
- name: Check if domain key file is present on the file system
  ansible.builtin.stat:
      path: "/etc/pki/tls/private/{{ k3s_domain }}.key"
  register: k3s_domain_key_file
  when:
      - k3s_domain is defined
      - k3s_domain != ""
      - k3s_install_exec == "server"

# Check if certificate and key secret have been added with kubectl
- name: Check if certificate and key secret have been added with kubectl
  ansible.builtin.command: "kubectl get secret -n ingress-system {{ k3s_domain_tls_secret_name}} -o name"
  register: cert_key_secret
  changed_when: false
  failed_when: false
  when:
      - k3s_domain is defined
      - k3s_domain != ""
      - k3s_install_exec == "server"
      - k3s_domain_cert_file is defined
      - k3s_domain_key_file is defined
      - k3s_domain_cert_file.stat.exists == true
      - k3s_domain_key_file.stat.exists == true

# Set expected secret name for comparison
- name: Set expected secret name
  ansible.builtin.set_fact:
      expected_secret_name: "secret/{{ k3s_domain_tls_secret_name }}"
  when:
      - k3s_domain is defined
      - k3s_domain != ""
      - k3s_install_exec == "server"

# Create the tls secret if it does not exist
- name: Create the tls secret if it does not exist
  ansible.builtin.command:
      cmd: "kubectl create secret tls {{ k3s_domain_tls_secret_name}} --cert=/etc/pki/ca-trust/source/anchors/{{ k3s_domain }}.pem --key=/etc/pki/tls/private/{{ k3s_domain }}.key -n ingress-system"
  when:
      - k3s_domain is defined
      - k3s_domain != ""
      - k3s_install_exec == "server"
      - k3s_domain_cert_file is defined
      - k3s_domain_key_file is defined
      - k3s_domain_cert_file.stat.exists == true
      - k3s_domain_key_file.stat.exists == true
      - cert_key_secret is defined
      - cert_key_secret.rc != 0
