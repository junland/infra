# Add Jellyfin helm repository
- name: Add Jellyfin helm repository
  ansible.builtin.command: helm repo add jellyfin https://jellyfin.github.io/jellyfin-helm
  register: jellyfin_repo_add
  failed_when: false
  changed_when: jellyfin_repo_add.rc == 0 and 'already exists' not in jellyfin_repo_add.stderr
  when:
      - k3s_install_exec == "server"

# Update Jellyfin helm repository
- name: Update Jellyfin helm repository
  ansible.builtin.command: helm repo update jellyfin
  when:
      - k3s_install_exec == "server"
      - jellyfin_repo_add.rc == 0

# Check if Jellyfin is already installed
- name: Check if Jellyfin is already installed
  ansible.builtin.command: helm status -n jellyfin jellyfin
  register: jellyfin_check
  failed_when: false
  changed_when: false
  when:
      - k3s_install_exec == "server"
      - jellyfin_repo_add.rc == 0

# Jellyfin values template file
- name: Put Jellyfin values config with jinja2 template
  ansible.builtin.template:
    src: jellyfin-values.j2
    dest: /tmp/jellyfin-values-config.yaml
    mode: "0644"
    force: true
  when:
      - k3s_install_exec == "server"

# Install / Upgrade Jellyfin using helm
- name: Install / Upgrade Jellyfin using helm
  ansible.builtin.command: helm install --create-namespace --atomic --hide-notes -n jellyfin jellyfin jellyfin/jellyfin --values /tmp/jellyfin-values-config.yaml
  when:
      - jellyfin_check.rc != 0
      - jellyfin_repo_add.rc == 0
      - k3s_install_exec == "server"
